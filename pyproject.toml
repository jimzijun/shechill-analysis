[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shechill-analysis"
version = "1.3.3"
description = "SheChill analysis and data processing application"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.0.3",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "plotly==5.24.1",
    "prophet==1.1.6",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "squareup==43.0.2.20250820",
    "python-dotenv==1.0.1",
    "APScheduler==3.10.4",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "black",
    "isort",
    "mypy",
    "types-pytz",
]

[tool.black]
line-length = 127
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 127

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true