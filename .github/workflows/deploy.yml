name: Deploy to Synology NAS

on:
  release:
    types: [ created ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy'
        required: true
        default: 'latest'

env:
  CONTAINER_NAME: shechill-analysis
  HEALTH_CHECK_TIMEOUT: 60
  ROLLBACK_TIMEOUT: 30

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version
      id: version
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
        else
          echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
        fi

    - name: Build and export Docker image
      run: |
        docker build -t ${{ env.CONTAINER_NAME }}:${{ steps.version.outputs.version }} .
        docker save ${{ env.CONTAINER_NAME }}:${{ steps.version.outputs.version }} | gzip > shechill-analysis.tar.gz

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh/
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/synology_nas
        chmod 600 ~/.ssh/synology_nas
        ssh-keyscan -H ${{ secrets.NAS_HOST }} >> ~/.ssh/known_hosts

    - name: Get current running version
      id: current_version
      run: |
        current_version=$(ssh -i ~/.ssh/synology_nas -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.NAS_HOST }} \
          "/usr/local/bin/docker inspect ${{ env.CONTAINER_NAME }} --format='{{.Config.Labels.version}}' 2>/dev/null || echo 'none'")
        echo "version=$current_version" >> $GITHUB_OUTPUT
        echo "Current version: $current_version"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ~1.0

    - name: Terraform Init
      run: |
        cd terraform
        terraform init

    - name: Terraform Plan
      run: |
        cd terraform
        terraform plan \
          -var="nas_host=${{ secrets.NAS_HOST }}" \
          -var="nas_username=${{ secrets.SSH_USER }}" \
          -var="image_name=${{ env.CONTAINER_NAME }}:${{ steps.version.outputs.version }}"

    - name: Create backup of current container
      run: |
        ssh -i ~/.ssh/synology_nas -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.NAS_HOST }} << 'ENDSSH'
          if /usr/local/bin/docker ps -q -f name=${{ env.CONTAINER_NAME }} | grep -q .; then
            echo "Creating backup of current container..."
            /usr/local/bin/docker commit ${{ env.CONTAINER_NAME }} ${{ env.CONTAINER_NAME }}:backup-$(date +%Y%m%d-%H%M%S)
            echo "Backup created successfully"
          else
            echo "No running container to backup"
          fi
        ENDSSH

    - name: Create upload directory and transfer Docker image to NAS
      run: |
        ssh -i ~/.ssh/synology_nas -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.NAS_HOST }} "mkdir -p /tmp/docker-uploads"
        scp -i ~/.ssh/synology_nas -o StrictHostKeyChecking=no shechill-analysis.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.NAS_HOST }}:/tmp/docker-uploads/

    - name: Terraform Apply
      id: deploy
      run: |
        cd terraform
        terraform apply \
          -var="nas_host=${{ secrets.NAS_HOST }}" \
          -var="nas_username=${{ secrets.SSH_USER }}" \
          -var="image_name=${{ env.CONTAINER_NAME }}:${{ steps.version.outputs.version }}" \
          -auto-approve

    - name: Post-deployment Health Check
      id: health_check
      run: |
        echo "Waiting for application to start..."
        sleep 15
        
        end_time=$((SECONDS + ${{ env.HEALTH_CHECK_TIMEOUT }}))
        
        while [ $SECONDS -lt $end_time ]; do
          if curl -f -s "http://${{ secrets.NAS_HOST }}:8001" > /dev/null 2>&1; then
            echo "✅ Health check passed!"
            echo "health_status=success" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Health check failed, retrying in 5 seconds..."
          sleep 5
        done
        
        echo "❌ Health check failed after ${{ env.HEALTH_CHECK_TIMEOUT }} seconds"
        echo "health_status=failed" >> $GITHUB_OUTPUT
        exit 1

    - name: Rollback on failure
      if: failure() && steps.health_check.outputs.health_status == 'failed'
      run: |
        echo "🔄 Starting rollback procedure..."
        
        ssh -i ~/.ssh/synology_nas -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.NAS_HOST }} << 'ENDSSH'
          echo "Stopping failed deployment..."
          /usr/local/bin/docker stop ${{ env.CONTAINER_NAME }} || true
          /usr/local/bin/docker rm ${{ env.CONTAINER_NAME }} || true
          
          # Find latest backup
          backup_image=$(/usr/local/bin/docker images --format "table {{.Repository}}:{{.Tag}}" | grep "${{ env.CONTAINER_NAME }}:backup-" | head -n1)
          
          if [[ -n "$backup_image" ]]; then
            echo "Rolling back to: $backup_image"
            /usr/local/bin/docker run -d --name ${{ env.CONTAINER_NAME }} --restart unless-stopped \
              -p 8001:8000 \
              -v /volume1/docker/shechill-analysis/config:/app/config \
              -v /volume1/docker/shechill-analysis/data:/app/data \
              -v /volume1/docker/shechill-analysis/logs:/app/logs \
              "$backup_image"
              
            echo "Rollback completed"
          else
            echo "No backup found, cannot rollback"
            exit 1
          fi
        ENDSSH
        
        # Verify rollback
        sleep 10
        if curl -f -s "http://${{ secrets.NAS_HOST }}:8001" > /dev/null 2>&1; then
          echo "✅ Rollback successful"
        else
          echo "❌ Rollback failed"
          exit 1
        fi

    - name: Cleanup old backups
      if: success()
      run: |
        ssh -i ~/.ssh/synology_nas -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.NAS_HOST }} << 'ENDSSH'
          echo "Cleaning up old backups (keeping last 3)..."
          /usr/local/bin/docker images --format "table {{.Repository}}:{{.Tag}}" | \
            grep "${{ env.CONTAINER_NAME }}:backup-" | \
            tail -n +4 | \
            xargs -r /usr/local/bin/docker rmi || true
        ENDSSH

    - name: Clean up
      if: always()
      run: |
        rm -f ~/.ssh/synology_nas
        rm -f shechill-analysis.tar.gz

    - name: Deployment Summary
      if: always()
      run: |
        echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Previous Version**: ${{ steps.current_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **New Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Deployment Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Health Check**: ${{ steps.health_check.outputs.health_status || 'not_run' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Endpoint**: http://${{ secrets.NAS_HOST }}:8001" >> $GITHUB_STEP_SUMMARY