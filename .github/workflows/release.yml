name: Release

permissions:
  contents: write
  pull-requests: write

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major

jobs:
  check-changes:
    name: Check for Release-worthy Changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      should_release: ${{ steps.changes.outputs.should_release }}
      new_version: ${{ steps.version.outputs.new_version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get latest tag
      id: latest_tag
      run: |
        latest_tag=$(git tag --list --sort=-creatordate | head -n1)
        if [[ -z "$latest_tag" ]]; then
          latest_tag=""
        fi
        echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT
        echo "has_tags=$([[ -n "$latest_tag" ]] && echo "true" || echo "false")" >> $GITHUB_OUTPUT

    - name: Check for changes since last tag
      id: changes
      run: |
        latest_tag="${{ steps.latest_tag.outputs.latest_tag }}"
        has_tags="${{ steps.latest_tag.outputs.has_tags }}"
        
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "Manual release triggered"
        else
          # Check if there are commits since last tag
          if [[ "$has_tags" == "true" ]]; then
            commits_since_tag=$(git rev-list ${latest_tag}..HEAD --count)
          else
            commits_since_tag=$(git rev-list HEAD --count)
          fi
          
          if [[ $commits_since_tag -gt 0 ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "Found $commits_since_tag commits since last tag"
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "No commits since last tag"
          fi
        fi

    - name: Determine version bump
      id: version
      run: |
        latest_tag="${{ steps.latest_tag.outputs.latest_tag }}"
        current_version=${latest_tag#v}
        
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          bump_type="${{ github.event.inputs.version_bump }}"
        else
          # Auto-determine bump type from commit messages
          commits_since_tag="${{ steps.latest_tag.outputs.latest_tag }}..HEAD"
          
          if git log $commits_since_tag --oneline | grep -E "(BREAKING CHANGE|!:|feat!:|fix!:)" > /dev/null; then
            bump_type="major"
          elif git log $commits_since_tag --oneline | grep -E "(feat:|feature:)" > /dev/null; then
            bump_type="minor"
          else
            bump_type="patch"
          fi
        fi
        
        # Parse current version
        IFS='.' read -ra VERSION_PARTS <<< "$current_version"
        major=${VERSION_PARTS[0]:-1}
        minor=${VERSION_PARTS[1]:-0}
        patch=${VERSION_PARTS[2]:-0}
        
        # Bump version
        case $bump_type in
          major)
            major=$((major + 1))
            minor=0
            patch=0
            ;;
          minor)
            minor=$((minor + 1))
            patch=0
            ;;
          patch)
            patch=$((patch + 1))
            ;;
        esac
        
        new_version="$major.$minor.$patch"
        echo "new_version=$new_version" >> $GITHUB_OUTPUT
        echo "Bumping from $current_version to $new_version ($bump_type)"

    - name: Generate changelog
      id: changelog
      run: |
        latest_tag="${{ steps.latest_tag.outputs.latest_tag }}"
        
        {
          echo "changelog<<EOF"
          echo "## Changes since $latest_tag"
          echo ""
          git log ${latest_tag}..HEAD --pretty=format:"- %s (%h)" --reverse
          echo ""
          echo "EOF"
        } >> $GITHUB_OUTPUT

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_release == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Create release branch and update version
      run: |
        new_version="${{ needs.check-changes.outputs.new_version }}"
        release_branch="release/v$new_version"
        
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Create and switch to release branch
        git checkout -b $release_branch
        
        # Update version in pyproject.toml
        sed -i "s/version = \".*\"/version = \"$new_version\"/" pyproject.toml
        
        # Commit version update
        git add pyproject.toml
        git commit -m "chore: bump version to v$new_version"
        
        # Push release branch
        git push origin $release_branch

    - name: Create Pull Request
      id: create_pr
      uses: actions/github-script@v7
      with:
        script: |
          const newVersion = "${{ needs.check-changes.outputs.new_version }}";
          const changelog = `${{ needs.check-changes.outputs.changelog }}`;
          
          const { data: pr } = await github.rest.pulls.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Release v${newVersion}`,
            head: `release/v${newVersion}`,
            base: 'main',
            body: `# Release v${newVersion}\n\n${changelog}\n\n---\n*This PR was automatically created by the release workflow.*`
          });
          
          core.setOutput('pr_number', pr.number);
          return pr.number;

    - name: Wait for status checks
      uses: actions/github-script@v7
      with:
        script: |
          const prNumber = ${{ steps.create_pr.outputs.pr_number }};
          const maxAttempts = 60; // Wait up to 10 minutes
          const delaySeconds = 10;
          
          for (let attempt = 1; attempt <= maxAttempts; attempt++) {
            // Get PR details to check status
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            // Get status checks for the PR
            const { data: status } = await github.rest.repos.getCombinedStatusForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha
            });
            
            console.log(`Attempt ${attempt}: Status is '${status.state}'`);
            
            if (status.state === 'success') {
              console.log('All status checks passed!');
              break;
            } else if (status.state === 'failure' || status.state === 'error') {
              throw new Error(`Status checks failed: ${status.state}`);
            }
            
            if (attempt === maxAttempts) {
              throw new Error('Timed out waiting for status checks to pass');
            }
            
            await new Promise(resolve => setTimeout(resolve, delaySeconds * 1000));
          }

    - name: Merge Pull Request
      uses: actions/github-script@v7
      with:
        script: |
          const prNumber = ${{ steps.create_pr.outputs.pr_number }};
          
          await github.rest.pulls.merge({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: prNumber,
            commit_title: `Release v${{ needs.check-changes.outputs.new_version }}`,
            commit_message: `Merge release v${{ needs.check-changes.outputs.new_version }}`,
            merge_method: 'merge'
          });

    - name: Create and push tag
      run: |
        new_version="${{ needs.check-changes.outputs.new_version }}"
        
        # Switch back to main and pull the merged changes
        git checkout main
        git pull origin main
        
        # Create and push tag
        git tag -a "v$new_version" -m "Release v$new_version"
        git push origin "v$new_version"

    - name: Cleanup release branch
      if: always()
      run: |
        new_version="${{ needs.check-changes.outputs.new_version }}"
        release_branch="release/v$new_version"
        
        # Delete remote release branch
        git push origin --delete $release_branch || true

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ needs.check-changes.outputs.new_version }}
        release_name: Release v${{ needs.check-changes.outputs.new_version }}
        body: |
          ${{ needs.check-changes.outputs.changelog }}
          
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ needs.check-changes.outputs.latest_tag }}...v${{ needs.check-changes.outputs.new_version }}
        draft: false
        prerelease: false