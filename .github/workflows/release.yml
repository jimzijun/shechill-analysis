name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "version_no_v=${VERSION#v}" >> $GITHUB_OUTPUT

    - name: Update version in pyproject.toml
      run: |
        sed -i "s/version = \".*\"/version = \"${{ steps.version.outputs.version_no_v }}\"/" pyproject.toml
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add pyproject.toml
        git commit -m "chore: update version to ${{ steps.version.outputs.version }}" || echo "No changes to commit"

    - name: Generate changelog
      id: changelog
      run: |
        PREVIOUS_TAG=$(git tag --list --sort=-creatordate | grep -v "${{ steps.version.outputs.version }}" | head -n1)
        if [[ -z "$PREVIOUS_TAG" ]]; then
          RANGE="HEAD"
        else
          RANGE="$PREVIOUS_TAG..${{ steps.version.outputs.version }}"
        fi
        
        {
          echo "changelog<<EOF"
          echo "## Changes"
          echo ""
          git log $RANGE --pretty=format:"- %s (%h)" --reverse
          echo ""
          echo "EOF"
        } >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        body: ${{ steps.changelog.outputs.changelog }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}