name: CI Pipeline

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install types-pytz

    - name: Run flake8
      run: |
        flake8 src/ web/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ web/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check code formatting with black
      run: black --check --diff src/ web/

    - name: Check import sorting with isort
      run: isort --check-only --diff src/ web/

    - name: Type check with mypy
      run: mypy src/ web/ --ignore-missing-imports --no-strict-optional

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install types-pytz

    - name: Basic import test
      run: |
        python -c "
        import sys
        sys.path.append('src')
        sys.path.append('web')
        try:
            from src.config_manager import ConfigManager
            from web.app import app
            print('✅ Basic imports successful')
        except ImportError as e:
            print(f'❌ Import error: {e}')
            sys.exit(1)
        "

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [lint, smoke-test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: shechill-analysis:ci-test
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

    - name: Test Docker image
      run: |
        # Test basic container functionality without full initialization
        echo "Testing basic Docker container functionality..."
        
        # Test 1: Basic container startup and Python environment
        echo "🧪 Test 1: Basic container startup and Python environment"
        docker run --rm --entrypoint /bin/bash shechill-analysis:ci-test -c "
          echo '✅ Container started successfully' &&
          python --version &&
          echo '✅ Python environment ready'
        "
        
        # Test 2: Python imports and dependencies
        echo "🧪 Test 2: Python imports and dependencies"
        docker run --rm --entrypoint /bin/bash shechill-analysis:ci-test -c "
          python -c 'import sys; sys.path.append(\"src\"); sys.path.append(\"web\"); from src.config_manager import ConfigManager; from web.app import app; print(\"✅ Basic imports successful\")'
        "
        
        # Test 3: Directory structure and permissions
        echo "🧪 Test 3: Directory structure and permissions"
        docker run --rm --entrypoint /bin/bash shechill-analysis:ci-test -c "
          ls -la docker-entrypoint.sh &&
          echo '✅ Entrypoint script exists and is executable'
        "
        
        echo "✅ All Docker tests passed successfully"

    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache