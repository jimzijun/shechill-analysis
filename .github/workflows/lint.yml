name: Python Linting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy
        
    - name: Install project dependencies (optional)
      run: |
        pip install -r requirements.txt
      continue-on-error: true

    - name: Run flake8
      run: |
        flake8 src/ web/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ web/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check code formatting with black
      run: |
        black --check --diff src/ web/

    - name: Check import sorting with isort
      run: |
        isort --check-only --diff src/ web/

    - name: Type check with mypy
      run: |
        mypy src/ web/ --ignore-missing-imports --no-strict-optional
      continue-on-error: true